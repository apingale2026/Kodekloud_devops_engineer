# Terraform Kodekloud level 3
# Terraform_level3_Task1
Managing Scalable NoSQL Databases with Amazon DynamoDB Using Terraform
main.tf 
```bash 
resource "aws_dynamodb_table" "basic_dyna" {
  name           = var.KKE_TABLE_NAME
  billing_mode   = "PAY_PER_REQUEST"
  hash_key       = "taskId"
 

  attribute {
    name = "taskId"
    type = "S"
  }
}

resource "aws_dynamodb_table_item" "dyno_task1" {
  table_name = aws_dynamodb_table.basic_dyna.name
  hash_key   = aws_dynamodb_table.basic_dyna.hash_key

  item = <<ITEM
{
  "taskId": {"S": "1"},
  "description": {"S": "Learn DynamoDB"},
  "status": {"S": "completed"}
}
ITEM
}

resource "aws_dynamodb_table_item" "dyno_task2" {
  table_name = aws_dynamodb_table.basic_dyna.name
  hash_key   = aws_dynamodb_table.basic_dyna.hash_key

  item = <<ITEM
{
  "taskId": {"S": "2"},
  "description": {"S": "Build To-Do App"},
  "status": {"S": "in-progress"}
}
ITEM
}
```
outputs.tf 
```bash 
output "kke_dynamodb_table_name" {
    value = aws_dynamodb_table.basic_dyna.name
}
```
# Terraform_level3_Task2
Building a Real-Time Data Ingestion Pipeline with Kinesis Firehose Using Terraform
main.tf
```bash 
resource "aws_s3_bucket" "example" {
  bucket = var.KKE_S3_BUCKET_NAME
}
resource "aws_iam_role" "test_role" {
  name = var.KKE_FIREHOSE_ROLE_NAME

  assume_role_policy = jsonencode({
    Version = "2012-10-17"
    Statement = [
      {
        Action = "sts:AssumeRole"
        Effect = "Allow"
        Sid    = ""
        Principal = {
          Service = "firehose.amazonaws.com"
        }
      },
    ]
  })
}
resource "aws_iam_policy" "policy" {
  name = "test_policy"
  policy = jsonencode({
    Version = "2012-10-17"
    Statement = [
      {
        Action = [
          "s3:AbortMultipartUpload",
          "s3:GetBucketLocation",
          "s3:GetObject",
          "s3:ListBucket",
          "s3:ListBucketMultipartUploads",
          "s3:PutObject"

        ]
        Effect   = "Allow"
        Resource = "${aws_s3_bucket.example.arn}/*"
      },
    ]
  })
}

resource "aws_iam_role_policy_attachment" "test_attach" {
  role       = aws_iam_role.test_role.name
  policy_arn = aws_iam_policy.policy.arn
}

resource "aws_kinesis_firehose_delivery_stream" "test_stream" {
  name        = var.KKE_FIREHOSE_STREAM_NAME
  destination = "extended_s3"
  extended_s3_configuration {
    role_arn           = aws_iam_role.test_role.arn
    bucket_arn         = aws_s3_bucket.example.arn
    buffering_size     = 5
    buffering_interval = 300

    processing_configuration {
      enabled = true

      processors {
        type = "AppendDelimiterToRecord"

        parameters {
          parameter_name  = "Delimiter"
          parameter_value = "\n"
        }
      }
    }
  }
  depends_on = [aws_iam_role_policy_attachment.test_attach]
}
```
variables.tf 
```bash 
variable "KKE_S3_BUCKET_NAME" {
  type        = string
  description = "s3 bucket"
  default     = "nautilus-stream-bucket-509730681"
}
variable "KKE_FIREHOSE_STREAM_NAME" {
  type        = string
  description = "firehose stream"
  default     = "nautilus-firehose-stream"
}
variable "KKE_FIREHOSE_ROLE_NAME" {
  type        = string
  description = "firehose role name"
  default     = "firehose-sts-role"
}
```
outputs.tf
```bash 
output "kke_firehose_stream_name" {
  value = aws_kinesis_firehose_delivery_stream.test_stream.name
}
output "kke_s3_bucket_name" {
  value = aws_s3_bucket.example.bucket
}
output "kke_firehose_role_arn" {
  value = aws_iam_role.test_role.arn
}
```
# Terraform_level3_Task3
Enforcing IAM Naming Standards and Permissions Using Terraform
main.tf 
```bash 
locals {
    sanitized_project = lower(replace(var.KKE_PROJECT,"[^a-zA-Z0-9-]","-"))
    sanitized_team = lower(replace(var.KKE_PROJECT,"[^a-zA-Z0-9-]","-"))

  name_prefix = "${local.sanitized_project}-${local.sanitized_team}"

common_tags {
    Project = "nautilus"
    Team = "dev-team"
    ManagedBy = "Terraform"
    Env = "dev"     
}
}

resource "aws_iam_user" "lb" {
  name = "${local.name_prefix}-user"
  tags = local.common_tags
}

resource "aws_iam_role" "test_role" {
  name = "${local.name_prefix}-role"

  assume_role_policy = jsonencode({
    Version = "2012-10-17"
    Statement = [
      {
        Action = "sts:AssumeRole"
        Effect = "Allow"
        Sid    = ""
        Principal = {
          Service = "ec2.amazonaws.com"
        }
      },
    ]
  })

  tags = merge (local.common_tags,
  {
    RoleType = "EC2"
  })
}
```
variables.tf 
```bash 
variable "KKE_PROJECT" {
    type = string 
    description = "project name"
    validation {
        condition = length(var.KKE_PROJECT) > 0
        error_message = "project should not be empty"
    }
}

variable "KKE_TEAM" {
    type = string 
    description = "team name" 
    validation {
        condition = can(regex("^[A-Za-z0-9_-]+$",var.KKE_TEAM))
        error_message = "Only letters, digits, dashes or underscores allowed"
    }
}

variable "KKE_ENVIRONMENT" {
    type = string 
    description = "env name"
}
```

outputs.tf 
```bash 
output "kke_user_name" {
    value = aws_iam_user.lb.name
}

output "kke_role_name" {
    value = aws_iam_role.test_role.name
}

output "kke_tags_applied" {
    value = aws_iam_user.lb.tags
}
```

