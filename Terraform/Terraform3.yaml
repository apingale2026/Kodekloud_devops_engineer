# Terraform_level3_Task10
Managing Terraform Workspaces for Environment Isolation Using Terraform
```bash
locals {
  name_prefix = terraform.workspace == "prod" ? "prod" : "dev"
}
resource "aws_api_gateway_rest_api" "example" {

  count = length(var.KKE_API_NAMES)
  name  = "${local.name_prefix}-${var.KKE_API_NAMES[count.index]}"
  tags = {
    Environment = terraform.workspace
  }
}

resource "aws_cloudwatch_log_group" "lg" {
  count = length(var.KKE_API_NAMES)
  name  = "/aws/apigateway/${local.name_prefix}-${var.KKE_API_NAMES[count.index]}"
  tags = {
    Environment = terraform.workspace

  }
}

resource "null_resource" "nl" {
  count      = length(var.KKE_API_NAMES)
  depends_on = [aws_api_gateway_rest_api.example, aws_cloudwatch_log_group.lg]
  triggers = {
    index = count.index

  }
  provisioner "local-exec" {
    command = <<-EOT
      echo "Created API Gateway ${local.name_prefix}-${var.KKE_API_NAMES[count.index]} in workspace ${terraform.workspace}" >> apigateway.log
      echo "Created Log Group /aws/apigateway/${local.name_prefix}-${var.KKE_API_NAMES[count.index]} in workspace ${terraform.workspace}" >> loggroups.log
    EOT
  }
}
```
```bash variables.tf
variable "KKE_API_NAMES" {
    type = list(string)
    description = "API names"
}
```
outputs.tf
```bash
output "kke_api_gateway_names" {
  value = [for api in aws_api_gateway_rest_api.example : api.name]
}

output "kke_log_group_names" {
  value = [for lg in aws_cloudwatch_log_group.lg : lg.name]
}
```

