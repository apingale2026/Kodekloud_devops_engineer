# Terraform_level3_Task7
Managing Multiple S3 Buckets with Fine-Grained Access Policies Using Terraform
main.tf
```bash 
resource "aws_s3_bucket" "env_bucket" {
  for_each = var.KKE_ENV_TAGS
  bucket   = each.value.bucket_name
  tags = {
    Name        = each.value.bucket_name
    Environment = each.value.environment
    Owner       = each.value.owner
    Backup      = each.value.backup
  }

  lifecycle {
    ignore_changes = [tags]
  }
}

resource "aws_s3_bucket_lifecycle_configuration" "glacier_lifecycle" {
  for_each = { for k, v in var.KKE_ENV_TAGS : k => v if v.backup == true }

  bucket = aws_s3_bucket.env_bucket[each.key].id

  rule {
    id     = "MoveToGlacier"
    status = "Enabled"

    filter {
      prefix = ""
    }

    transition {
      days          = 30
      storage_class = "GLACIER"
    }
  }
}


resource "aws_s3_bucket_policy" "public_read" {
  for_each = var.KKE_ENV_TAGS

  bucket = aws_s3_bucket.env_bucket[each.key].id

  policy = jsonencode({
    Version = "2012-10-17"
    Statement = [
      {
        Sid       = "PublicReadGetObject"
        Effect    = "Allow"
        Principal = "*"
        Action    = "s3:GetObject"
        Resource  = "${aws_s3_bucket.env_bucket[each.key].arn}/*"
      }
    ]
  })

  depends_on = [aws_s3_bucket.env_bucket]
}
```
variables.tf
```bash 
variable "KKE_ENV_TAGS" {
  description = "env_tags"
  type = map(object({
    bucket_name = string
    environment = string
    owner       = string
    backup      = bool
  }))
}
````
outputs.tf 
```bash
output "kke_bucket_names" {
  description = "Names of the created S3 buckets"
  value       = [for b in aws_s3_bucket.datacenter_buckets : b.bucket]
}
```
# Terraform_level3_Task8
Hosting a Static Website on Amazon S3 with Custom Configuration Using Terraform
main.tf 
```bash 
module "s3-static-site" {
    source = "./modules/s3-static-site"
    bucket_name = "datacenter-web-174338504"
    index_document = "index.html"
}
output "website_url" {
  value = module.s3-static-site.website_url
}

```
module 
variable.tf 
```bash
variable "bucket_name" {
    type = string 
    description = "bucket name"
}
variable "index_document" {
    type = string 
    description = "index doc"
} 
```
main.tf 
```bash 
resource "aws_s3_bucket" "s3buck" {
    bucket = var.bucket_name
    tags = {
    Project = "StaticWeb"
  }
}

resource "aws_s3_bucket_policy" "b" {
  bucket = aws_s3_bucket.s3buck.id

  policy = jsoncode(
{
  "Version": "2012-10-17",
  "Statement": [
    {
      "Sid": "Pubaccess",
      "Effect": "Allow",
      "Principal": "*",
      "Action": "s3:GetObject",
      "Resource": "${aws_s3_bucket.s3buck.arn}/*"
    }
  ]
}
  )
}

resource "aws_s3_bucket_website_configuration" "example" {
  bucket = aws_s3_bucket.s3buck.id

  index_document {
    suffix = var.index_document
  }
  
}

resource "aws_s3_object" "index_html" {
  bucket       = aws_s3_bucket.s3buck.id
  key          = var.index_document
  source       = "${path.root}/${var.index_document}"
  content_type = "text/html"

  depends_on = [aws_s3_bucket.s3buck]
}
```
outputs.tf 
```bash
output "website_url" {
    value = "http://aws:4566/${var.bucket_name}/${var.index_document}"
}


```
