# Terraform Level2_Task6
main.tf 
```bash 
# Provision EC2 instance
resource "aws_instance" "ec2" {
  ami           = "ami-0c101f26f147fa7fd"
  instance_type = "t2.micro"
  vpc_security_group_ids = [
    "sg-f23898a9bfc47bb60"
  ]

  tags = {
    Name = "nautilus-ec2"
  }
}

resource "aws_ami_from_instance" "example" {
  name               = "nautilus-ec2-ami"
  source_instance_id = aws_instance.ec2.id
  depends_on         = [aws_instance.ec2]
}

resource "aws_instance" "web" {
  ami           = aws_ami_from_instance.example.id
  instance_type = "t2.micro"
  vpc_security_group_ids = [
    "sg-f23898a9bfc47bb60"
  ]

  tags = {
    Name = "nautilus-ec2-new"
  }
  depends_on = [aws_ami_from_instance.example]
}
```
outputs.tf 
```bash 
output "KKE_ami_id" {
  value = aws_ami_from_instance.example.id
}

output "KKE_new_instance_id" {
  value = aws_instance.web.id
}
```
# Terraform Level2_Task7
The monitoring team wants to improve observability into the streaming infrastructure. Your task is to implement a solution using Amazon Kinesis and CloudWatch. The team wants to ensure that if write throughput exceeds provisioned limits, an alert is triggered immediately.
```bash 
output "kke_kinesis_stream_name" {
  value = aws_kinesis_stream.test_stream.name
}
output "kke_kinesis_alarm_name" {
  value = aws_cloudwatch_metric_alarm.foobar.alarm_name
}
```
```bash 
resource "aws_kinesis_stream" "test_stream" {
  name             = "nautilus-kinesis-stream"
  shard_count      = 1
  retention_period = 24

  shard_level_metrics = [
    "IncomingBytes",
    "OutgoingBytes",
    "WriteProvisionedThroughputExceeded",
    "ReadProvisionedThroughputExceeded"
  ]



  tags = {
    Environment = "test"
  }
}

resource "aws_cloudwatch_metric_alarm" "foobar" {
  alarm_name          = "nautilus-kinesis-alarm"
  comparison_operator = "GreaterThanOrEqualToThreshold"
  evaluation_periods  = "1"
  metric_name         = "WriteProvisionedThroughputExceeded"
  namespace           = "AWS/Kinesis"
  period              = "60"
  statistic           = "Sum"
  threshold           = "1"
  treat_missing_data  = "notBreaching"

  dimensions = {
    StreamName = aws_kinesis_stream.test_stream.name
  }

}

```

