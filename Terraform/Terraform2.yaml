# Terraform Level2_Task1
variables.tf
```bash
variable "KKE_VPC_NAME" {
  type        = string
  description = "Name of the VPC"
}

variable "KKE_SUBNET_NAME" {
  type        = string
  description = "Name of the Subnet"
}
```
terraform.tfvars
```bash
KKE_VPC_NAME    = "devops-vpc"
KKE_SUBNET_NAME = "devops-subnet"
```
main.tf 
```bash
resource "aws_vpc" "devops_vpc" {
  cidr_block = "10.0.0.0/16"
  
  tags = {
    Name = var.KKE_VPC_NAME
  }
}

resource "aws_subnet" "devops_subnet" {
  vpc_id            = aws_vpc.devops_vpc.id
  cidr_block        = "10.0.1.0/24"
  availability_zone = "us-east-1a"
  
  depends_on = [
    aws_vpc.datacenter_vpc
  ]
  
  tags = {
    Name = var.KKE_SUBNET_NAME
  }
}
```
outputs.tf 
```bash
output "kke_vpc_name" {
  value = aws_vpc.devops_vpc.tags["Name"]
}

output "kke_subnet_name" {
  value = aws_subnet.devops_subnet.tags["Name"]
}
```


# Terraform Level2_Task2
variables.tf

```bash
variable "KKE_VPC_CIDR" {
    type = string 
    description = "vpc_cidr"
    default = "10.0.0.0/16"
}
variable "KKE_SUBNET_CIDR" {
    type = string 
    description = "subnet_cidr"
    default = "10.0.1.0/24"
}
```
main.tf
```bash
resource "aws_vpc" "main" {
  cidr_block       = var.KKE_VPC_CIDR
  instance_tenancy = "default"

  tags = {
    Name = "xfusion-priv-vpc"
  }
}

resource "aws_subnet" "main" {
  vpc_id                  = aws_vpc.main.id
  cidr_block              = var.KKE_SUBNET_CIDR
  map_public_ip_on_launch = false


  tags = {
    Name = "xfusion-priv-subnet"
  }
}

resource "aws_instance" "example" {
  ami                    = "ami-0c02fb55956c7d316"
  instance_type          = "t2.micro"
  subnet_id              = aws_subnet.main.id
  vpc_security_group_ids = [aws_security_group.allow_vpc.id]
  tags = {
    Name = "xfusion-priv-ec2"
  }
}
resource "aws_security_group" "allow_vpc" {
  name        = "allow_vpc"
  description = "Allow inbound traffic within VPC and all outbound traffic"
  vpc_id      = aws_vpc.main.id

  tags = {
    Name = "allow_vpc"
  }
  egress {
    from_port   = 0
    to_port     = 0
    protocol    = "-1"
    cidr_blocks = ["0.0.0.0/0"]

  }
  ingress {
    from_port   = 0
    to_port     = 0
    protocol    = "-1"
    cidr_blocks = [var.KKE_VPC_CIDR]

  }
}
```
outputs.tf
```bash
output "KKE_vpc_name" {
    value = aws_vpc.main.tags["Name"]
}
output "KKE_subnet_name" {
    value = aws_subnet.main.tags["Name"]
}
output "KKE_ec2_private" {
    value = aws_instance.example.tags["Name"]
}
```
