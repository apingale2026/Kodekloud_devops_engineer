# Terraform Level2_Task10
##Grant EC2 Access to S3 Bucket Using Terraform
data.aws_ami.amazon_linux_2
aws_iam_instance_profile.data_profile
aws_iam_policy.policy_p1
aws_iam_role.data_role
aws_iam_role_policy_attachment.data_attach_policy
aws_instance.data-ec2
aws_s3_bucket.data_s3
```bash 
resource "aws_instance" "data-ec2" {
  ami           = data.aws_ami.amazon_linux_2.id
  instance_type = "t3.micro"
  iam_instance_profile = aws_iam_instance_profile.data_profile.name
  tags = {
    Name = "datacenter-ec2"
  }
}
resource "aws_s3_bucket" "data_s3" {
  bucket = var.KKE_BUCKET_NAME
}

resource "aws_iam_policy" "policy_p1" {
  name = var.KKE_POLICY_NAME

  policy = jsonencode({
    Version = "2012-10-17"
    Statement = [
      {
        Action   = ["s3:PutObject"]
        Effect   = "Allow"
        Resource = "${aws_s3_bucket.data_s3.arn}/*"
      },
    ]
  })
}

resource "aws_iam_role" "data_role" {
  name = var.KKE_ROLE_NAME
  assume_role_policy = jsonencode({
    Version = "2012-10-17"
    Statement = [{
      Action    = "sts:AssumeRole"
      Effect    = "Allow"
      Principal = { Service = "ec2.amazonaws.com" }
    }]
  })
}

resource "aws_iam_instance_profile" "data_profile" {
  name = "instance_profile"
  role = aws_iam_role.data_role.name
}

resource "aws_iam_role_policy_attachment" "data_attach_policy" {
  role       = aws_iam_role.data_role.name
  policy_arn = aws_iam_policy.policy_p1.arn
}
```

# Terraform Level2_Task11
Implement S3 Lifecycle Management Policy Using Terraform
```bash 
resource "aws_s3_bucket" "buck_1" {
  bucket = "nautilus-lifecycle-253932233"
}
resource "aws_s3_bucket_versioning" "versioning_bucket" {
  bucket = aws_s3_bucket.buck_1.id
  versioning_configuration {
    status = "Enabled"
  }
}

resource "aws_s3_bucket_lifecycle_configuration" "bucket-config" {
  bucket = aws_s3_bucket.buck_1.bucket

  rule {
    id     = "nautilus-lifecycle-rule"
    status = "Enabled"
    filter {
        prefix = ""
    }
    expiration {
      days = 365
    }

    transition {
      days          = 30
      storage_class = "STANDARD_IA"
    }

  }
}
```
