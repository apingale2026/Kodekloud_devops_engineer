# Terraform Level2_Task7
The monitoring team wants to improve observability into the streaming infrastructure. Your task is to implement a solution using Amazon Kinesis and CloudWatch. The team wants to ensure that if write throughput exceeds provisioned limits, an alert is triggered immediately.
```bash 
output "kke_kinesis_stream_name" {
  value = aws_kinesis_stream.test_stream.name
}
output "kke_kinesis_alarm_name" {
  value = aws_cloudwatch_metric_alarm.foobar.alarm_name
}
```
```bash 
resource "aws_kinesis_stream" "test_stream" {
  name             = "nautilus-kinesis-stream"
  shard_count      = 1
  retention_period = 24

  shard_level_metrics = [
    "IncomingBytes",
    "OutgoingBytes",
    "WriteProvisionedThroughputExceeded",
    "ReadProvisionedThroughputExceeded"
  ]



  tags = {
    Environment = "test"
  }
}

resource "aws_cloudwatch_metric_alarm" "foobar" {
  alarm_name          = "nautilus-kinesis-alarm"
  comparison_operator = "GreaterThanOrEqualToThreshold"
  evaluation_periods  = "1"
  metric_name         = "WriteProvisionedThroughputExceeded"
  namespace           = "AWS/Kinesis"
  period              = "60"
  statistic           = "Sum"
  threshold           = "1"
  treat_missing_data  = "notBreaching"

  dimensions = {
    StreamName = aws_kinesis_stream.test_stream.name
  }

}

```

# Terraform Level2_Task8
##Sync Data to S3 Bucket with Terraform
main.tf
```bash
resource "aws_s3_bucket" "wordpress_bucket" {
  bucket = "nautilus-s3-30530613"
}

resource "aws_s3_bucket_acl" "wordpress_bucket_acl" {
  bucket = aws_s3_bucket.wordpress_bucket.id
  acl    = "private"
}

resource "aws_s3_bucket" "wordpress_bucket_new" {
  bucket = var.KKE_BUCKET
}

resource "aws_s3_bucket_acl" "wordpress_bucket_new_acl" {
  bucket = aws_s3_bucket.wordpress_bucket_new.id
  acl    = "private"
}

resource "null_resource" "local_provisioner_old_new" {
  provisioner "local-exec" {
    command = "aws --endpoint-url=http://aws:4566 s3 sync s3://nautilus-s3-30530613 s3://${var.KKE_BUCKET}"
  }
  depends_on = [
    aws_s3_bucket.wordpress_bucket_new,
    aws_s3_bucket_acl.wordpress_bucket_new_acl
  ]
}

```
variable.tf
```bash
variable "KKE_BUCKET" {
  type        = string
  description = "new bucket name"
  default     = "nautilus-sync-30530613"
}
```
outputs.tf
```bash
output "new_kke_bucket_name" {
  value = aws_s3_bucket.wordpress_bucket_new.bucket
}

output "new_kke_bucket_acl" {
  value = aws_s3_bucket_acl.wordpress_bucket_new_acl.acl
}
```

```bash 
aws --endpoint-url=http://aws:4566 s3 ls s3://nautilus-s3-30530613 --recursive
aws --endpoint-url=http://aws:4566 s3 ls s3://nautilus-sync-30530613 --recursive
```


