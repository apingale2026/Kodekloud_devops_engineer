```bash 

Common AWS Namespaces

AWS reserves namespaces using the AWS/Service naming convention. If you were to change what you are monitoring, you would swap out the namespace:

AWS Service	Namespace Value
Amazon EC2 (Virtual Servers)	AWS/EC2
Amazon RDS (Databases)	AWS/RDS
AWS Lambda (Serverless Functions)	AWS/Lambda
Amazon S3 (Storage)	AWS/S3
```

