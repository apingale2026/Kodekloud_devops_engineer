# Terraform1_Task7_Create_ec2_instance

resource "tls_private_key" "xfusion-kp" {
  algorithm = "RSA"
  rsa_bits  = 4096
}

resource "aws_key_pair" "xfusion-kp" {
  key_name   = "xfusion-kp"
  public_key = tls_private_key.xfusion-kp.public_key_openssh
}

resource "aws_instance" "xfusion-ec2" {
  ami           = "ami-0c101f26f147fa7fd"
  instance_type = "t2.micro"
  key_name      = aws_key_pair.xfusion-kp.key_name

  tags = {
    Name = "xfusion-ec2"
  }
}

# Terraform1_Task8_Create_ec2_from_ami
resource "aws_instance" "ec2" {
  ami           = "ami-0c101f26f147fa7fd"
  instance_type = "t2.micro"
  vpc_security_group_ids = [
    "sg-1b19852071773be7e"
  ]

  tags = {
    Name = "xfusion-ec2"
  }
}

resource "aws_ami_from_instance" "xfusion-ec2-ami" {
  name               = "xfusion-ec2-ami"
  source_instance_id = aws_instance.ec2.id
}

# Terraform1_Task9_Create_ebs_volume
resource "aws_ebs_volume" "nautilus-volume" {
  availability_zone = "us-east-1a"
  size              = 2
  type              = "gp3"


  tags = {
    Name = "nautilus-volume"
  }
}


# Terraform1_Task10_Create_snapshot_using_ebs_volume

resource "aws_ebs_volume" "k8s_volume" {
  availability_zone = "us-east-1a"
  size              = 5
  type              = "gp2"

  tags = {
    Name        = "datacenter-vol"
  }
}

resource "aws_ebs_snapshot" "datacenter-vol-ss" {
  volume_id = aws_ebs_volume.k8s_volume.id
  description = "Datacenter Snapshot"

  tags = {
    Name = "datacenter-vol-ss"
  }
}

# Terraform1_Task11_Create_AWS_cloudwatch_alarm

resource "aws_cloudwatch_metric_alarm" "nautilus-alarm" {
  alarm_name                = "nautilus-alarm"
  comparison_operator       = "GreaterThanThreshold"
  evaluation_periods        = 1
  metric_name               = "CPUUtilization"
  namespace                 = "AWS/EC2"
  period                    = 300
  statistic                 = "Average"
  threshold                 = 80
  alarm_description         = "This metric monitors ec2 cpu utilization"
  
}

# Terraform1_Task12_Create_Public_S3_Bucket 

resource "aws_s3_bucket" "devops-s3-24889" {
  bucket = "devops-s3-24889"

  tags = {
    Name = "devops-s3-24889"
  }
}


resource "aws_s3_bucket_acl" "public_acl" {
  bucket = aws_s3_bucket.devops-s3-24889.id
  acl    = "public-read"
}


resource "aws_s3_bucket_public_access_block" "disable_block" {
  bucket = aws_s3_bucket.devops-s3-24889.id

  block_public_acls       = false
  block_public_policy     = false
  ignore_public_acls      = false
  restrict_public_buckets = false
}

# Terraform1_Task13_Create_Private_S3_Bucket

resource "aws_s3_bucket" "nautilus-s3-11652" {
  bucket = "nautilus-s3-11652"

  tags = {
    Name        = "nautilus-s3-11652"

  }
}

# Terraform1_Task14_Create_IAM_User

resource "aws_iam_user" "iamuser_james" {
  name = "iamuser_james"

  tags = {
    tag-key = "iamuser_james"
  }
}

# Terraform1_Task15_Create_IAM_Group

resource "aws_iam_group" "iamgroup_john" {
  name = "iamgroup_john"
}

# Terraform1_Task16_Create_IAM_Policy

resource "aws_iam_policy" "iampolicy_john" {
  name        = "iampolicy_john"
  description = "IAM Policy for EC2 Access"

  
  policy = jsonencode({
    Version = "2012-10-17"
    Statement = [
      {
        Action = [
        "ec2:DescribeInstances", 
         "ec2:DescribeImages",
         "ec2:DescribeSnapshots"
        ]
        Effect   = "Allow"
        Resource = "*"
      },
    ]
  })
}

# Terraform1_Task17_Create_Dynamodb_table

resource "aws_dynamodb_table" "nautilus-users" {
  name           = "nautilus-users"
  billing_mode   = "PAY_PER_REQUEST"
  hash_key       = "nautilus_id"

  attribute {
    name = "nautilus_id"
    type = "S"
  }

  tags = {
    Name        = "nautilus-users"
    
  }
}

# Terraform1_Task18_Create_AWS_Kinesis

resource "aws_kinesis_stream" "datacenter-stream" {
  name             = "datacenter-stream"
  shard_count      = 1
  retention_period = 48

  shard_level_metrics = [
    "IncomingBytes",
    "OutgoingBytes",
  ]

  stream_mode_details {
    stream_mode = "PROVISIONED"
  }

}

# Terraform1_Task19_Create_AWS_Kinesis

resource "aws_sns_topic" "datacenter-notifications" {
  name = "datacenter-notifications"
}


# Terraform1_Task20_Create_SSM_Parameter

resource "aws_ssm_parameter" "devops-ssm-parameter" {
  name  = "devops-ssm-parameter"
  type  = "String"
  value = "devops-value"
}

# Terraform1_Task21_Create_CloudWatch_logGroup_logStream

resource "aws_cloudwatch_log_group" "devops-log-group" {
  name = "devops-log-group"
}
resource "aws_cloudwatch_log_stream" "devops-log-stream" {
  name           = "devops-log-stream"
  log_group_name = aws_cloudwatch_log_group.devops-log-group.name
}

# Terraform1_Task22_CloudFormation_Template

resource "aws_cloudformation_stack" "devops-stack" {
  name = "devops-stack"
  template_body = <<EOF
{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "CloudFormation stack with S3 bucket",
  "Resources": {
    "DevopsBucket": {
      "Type": "AWS::S3::Bucket",
      "Properties": {
        "BucketName": "devops-bucket-31138",
        "VersioningConfiguration": {
          "Status": "Enabled"
        }
      }
    }
  }
}
EOF
}


# Terraform1_Task23_OpenSearchDomain
Amazon OpenSearch in AWS is a fully managed service that makes it easy to deploy, operate, and scale OpenSearch clusters in the cloud. OpenSearch itself is an open-source search and analytics engine, originally derived from Elasticsearch, and AWS provides it as a managed offering with added integrations, security, and monitoring.

resource "aws_opensearch_domain" "datacenter-es" {
  domain_name    = "datacenter-es"
}

# Terraform1_Task24_Create_Secrets
resource "aws_secretsmanager_secret" "datacenter_secret" {
  name = "datacenter-secret"
  description = "Secret for storing datacenter credentials"
}

variable "example" {
  default = {
    "username": "admin",
  "password": "Namin123"
  }

  type = map(string)
}

resource "aws_secretsmanager_secret_version" "datacenter_secret_value" {
  secret_id     = aws_secretsmanager_secret.datacenter_secret.id
  secret_string = jsonencode(var.example)
}

# Terraform1_Task25_Change_Instance_Type
Change instance type from t2.micro to t2.nano in main.tf and save it
terraform plan
terraform apply 
Verify instance status is running - aws ec2 describe-instance-status

# Terraform1_Task26_Attach_Elastic_IP_Using_Terraform

In main.tf in resource eip block add below line and save and terraform plan and apply
     instance = aws_instance.ec2.id

aws ec2 describe-instances --instance-ids i-a9ce6cd51fe4ea071 \
  --query "Reservations[*].Instances[*].PublicIpAddress" --output text


# Terraform1_Task27_Attach_IamUser_ToIAMPolicy
Add below code in main.tf and use terraform plan and terraform apply 

resource "aws_iam_policy_attachment" "test-attach" {
  name       = "test-attachment"
  users      = [aws_iam_user.user.name]
  policy_arn = aws_iam_policy.policy.arn
}

# Terraform1_Task28_Enable_S3_Versioning
Add below code in main.tf and use terraform plan and terraform apply 

resource "aws_s3_bucket_versioning" "versioning_example" {
  bucket = aws_s3_bucket.s3_ran_bucket.id
  versioning_configuration {
    status = "Enabled"
  }
}

# Terraform1_Task29_CopyBucketToLocal_deleteBucket

resource "null_resource" "s3_cleanup" {
  provisioner "local-exec" {
    command = "aws s3 cp s3://xfusion-bck-18407 /opt/s3-backup/ --recursive"
  }

  provisioner "local-exec" {
    command = "aws s3 rb s3://xfusion-bck-18407 --force"
  }
}


