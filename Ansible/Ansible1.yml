# Ansible1_Task5_Create_empty_file_with_user_and_group_owner_file_permission
- name: Create empty file 
  hosts: all
  become: true
  tasks:
    - name: Create empty file
      file:
        path: /home/data.txt
        state: touch 
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0744"
