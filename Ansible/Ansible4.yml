# Ansible4_Task1_Gathering_Facts
- name: Facts_Gathering 
  hosts: all 
  become: true
  gather_facts: true
  tasks: 
    - name: Create facts.txt using blockinfile 
      blockinfile:
        create: yes
        path: /root/facts.txt
        block: |
          Ansible managed node architecture is {{ ansible_architecture }}
    - name: Install httpd package
      yum: 
        name: httpd
        state: present 
    - name: Copy facts.txt to /var/www/html/index.html
      copy: 
        src: /root/facts.txt
        dest: /var/www/html/index.html
        remote_src: yes
    - name: Start a service
      service:
        name: httpd
        state: started 
