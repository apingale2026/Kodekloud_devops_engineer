#Ansible4_Task4_setup_http_php
- name: Setup http and php 
  hosts: all 
  become: true
  tasks: 
    - name: Install http and php package 
      yum: 
        name: 
          - httpd
          - php 
        state: present 
    - name: Replace documentroot directory 
      replace: 
        path: /etc/httpd/conf/httpd.conf
        regexp: DocumentRoot \"\/var\/www\/html\"
        replace: DocumentRoot "/var/www/html/myroot"
    - name: Create directory
      file:
        path: /var/www/html/myroot
        state: directory 
        owner: apache
        group: apache
    - name: copy template to phpinfo.php
      template: 
        src: ~/playbooks/templates/phpinfo.php.j2
        dest: /var/www/html/myroot/phpinfo.php
        owner: apache
        group: apache 
    - name: start apache service
      service: 
        name: httpd
        state: started 
        enabled: yes 
