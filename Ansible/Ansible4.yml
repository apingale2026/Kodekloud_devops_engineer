#Ansible4_Task5_Use_Condition
- name: Use Condition 
  hosts: all 
  become: true
  tasks:
    - name: copy file to Appserver1
      copy:
        src: /usr/src/data/blog.txt
        dest: /opt/data
        owner: tony
        group: tony
        mode: "0744"
      when: ansible_nodename == "stapp01"
    - name: copy file to Appserver2
      copy:
        src: /usr/src/data/story.txt
        dest: /opt/data
        owner: steve
        group: steve
        mode: "0744"
      when: ansible_nodename == "stapp02"
    - name: copy file to Appserver3
      copy:
        src: /usr/src/data/media.txt
        dest: /opt/data
        owner: banner
        group: banner
        mode: "0744"
      when: ansible_nodename == "stapp03"
