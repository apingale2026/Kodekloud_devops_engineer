            secretKeyRef:
              name: mysql-user-pass 
              key: username
        - name: MYSQL_PASSWORD
          valueFrom: 
            secretKeyRef:
              name: mysql-user-pass 
              key: password
        - name: MYSQL_HOST
          valueFrom: 
            secretKeyRef:
              name: mysql-host 
              key: host  
      volumes: 
      - name: php-ini
