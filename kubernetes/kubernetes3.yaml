apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: lamp-wp
  name: lamp-wp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lamp-wp
  strategy: {}
  template:
    metadata:
      labels:
        app: lamp-wp
    spec:
      containers:
      - image: webdevops/php-apache:alpine-3-php7
        name: httpd-php-container
        ports:
        - containerPort: 80
        volumeMounts:
        - name: php-ini 
          mountPath: /opt/docker/etc/php/php.ini
          subPath: php.ini
        env: 
        - name: MYSQL_ROOT_PASSWORD
          valueFrom: 
            secretKeyRef:
              name: mysql-root-pass 
              key: password 
        - name: MYSQL_DATABASE
          valueFrom: 
            secretKeyRef:
              name: mysql-db-url 
              key: database
        - name: MYSQL_USER
          valueFrom: 
            secretKeyRef:
              name: mysql-user-pass 
              key: username
        - name: MYSQL_PASSWORD
          valueFrom: 
            secretKeyRef:
              name: mysql-user-pass 
              key: password
        - name: MYSQL_HOST
          valueFrom: 
            secretKeyRef:
              name: mysql-host 
              key: host
      - image: mysql:5.6
        name: mysql-container
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: php-ini 
          mountPath: /opt/docker/etc/php/php.ini
          subPath: php.ini
        env: 
        - name: MYSQL_ROOT_PASSWORD
          valueFrom: 
            secretKeyRef:
