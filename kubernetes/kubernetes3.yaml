# Kubernetes3_Task6_Environment_Variable_Field_Reference
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: envars
  name: envars
spec:
  containers:
  - image: httpd:latest
    name: fieldref-container
    command: ["sh", "-c"]
    args:
      - while true; do
          echo '';
          printenv NODE_NAME POD_NAME;
          printenv POD_IP POD_SERVICE_ACCOUNT;
          sleep 10;
        done;
    env:
    - name: NODE_NAME
      valueFrom:
        fieldref:
          fieldPath: spec.nodeName
    - name: POD_NAME
      valueFrom:
        fieldref:
          fieldPath: metadata.name
    - name: POD_IP
      valueFrom:
        fieldref:
          fieldPath: status.podIP
    - name: POD_SERVICE_ACCOUNT
      valueFrom:
        fieldref:
          fieldPath: spec.serviceAccountName
  restartPolicy: Always

