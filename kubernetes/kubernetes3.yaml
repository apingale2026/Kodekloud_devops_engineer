# Kuberenetes3_Task9_Deploy_App
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: iron-gallery
  name: iron-gallery-deployment-xfusion
  namespace: iron-namespace-xfusion
spec:
  replicas: 1
  selector:
    matchLabels:
      run: iron-gallery
  template:
    metadata:
      labels:
        run: iron-gallery
    spec:
      containers:
      - image: kodekloud/irongallery:2.0
        name: iron-gallery-container-xfusion
        resources: 
          limits:
            cpu: "50m"
            memory: "100Mi"
        volumeMounts:
        - name: config 
          mountPath: /usr/share/nginx/html/data
        - name: images 
          mountPath: /usr/share/nginx/html/uploads
      volumes:
      - name: config 
        emptyDir: {}
      - name: images
        emptyDir: {}
---
