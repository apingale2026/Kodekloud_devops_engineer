# Kubernetes3_Task3_Init_Container
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ic-devops
  name: ic-deploy-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ic-devops
  strategy: {}
  template:
    metadata:
      labels:
        app: ic-devops
    spec:
      initContainers:
      - image: debian:latest
        name: ic-msg-devops
        command: ["/bin/bash", "-c", "echo 'Init Done - Welcome to xFusionCorp Industries' > /ic/beta"]
        volumeMounts:
        - name: ic-volume-devops
          mountPath: /ic
      containers:
      - image: debian:latest
        name: ic-main-devops
        command: ["/bin/bash", "-c", "while true; do cat /ic/beta; sleep 5; done"]
        volumeMounts:
        - name: ic-volume-devops
          mountPath: /ic
      volumes:
      - name: ic-volume-devops
        emptyDir: {}

# Kubernetes3_Task4_Persistent_Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-xfusion
spec:
  capacity:
    storage: 3Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  hostPath:
    path: /mnt/devops
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-xfusion
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
  storageClassName: manual
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: pod-xfusion
  name: pod-xfusion
spec:
  containers:
  - image: httpd:latest
    name: container-xfusion
    volumeMounts:
    - name: pv-vol 
      mountPath: /var/www/html
  volumes:
  - name: pv-vol
    persistentVolumeClaim:
      claimName: pvc-xfusion
---
apiVersion: v1
kind: Service
metadata:
  labels:
    run: pod-xfusion
  name: web-xfusion
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
    nodePort: 30008
  selector:
    run: pod-xfusion
  type: NodePort

