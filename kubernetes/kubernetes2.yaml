# Kubernetes2_Task4_Print_Env_Variable
apiVersion: v1
kind: Pod
metadata:
  name: print-envars-greeting
spec:
  restartPolicy: Never
  containers:
  - image: bash
    name: print-env-container
    env: 
    - name: GREETING
      value: "Welcome to"
    - name: COMPANY
      value: "xFusionCorp"
    - name: GROUP
      value: "Datacenter"
    command: ["/bin/sh", "-c", 'echo "$(GREETING) $(COMPANY) $(GROUP)"']
      
# Kubernetes2_Task5_Rolling_Update_Roll_Back
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-deploy
  namespace: xfusion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: httpd-deploy
  strategy: 
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 2 
  template:
    metadata:
      labels:
        app: httpd-deploy
    spec:
      containers:
      - image: httpd:2.4.25
        name: httpd
        
svc.yaml 
apiVersion: v1
kind: Service
metadata:
  name: httpd-service
  namespace: xfusion
spec:
  ports:
  - nodePort: 30008
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: httpd-deploy
  type: NodePort
  
Upgrading Image 
#kubectl -n xfusion set image deployments httpd-deploy httpd=httpd:2.4.43

Check rollout status
#kubectl rollout status deployment/httpd-deploy -n xfusion
#kubectl rollout history deployment/httpd-deploy -n xfusion

Rollout Undo 
#kubectl rollout undo deployment/httpd-deploy -n xfusion

