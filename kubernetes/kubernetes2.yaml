# Kubernetes2_Task1_Shared_Volume
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: volume-share-datacenter
  name: volume-share-datacenter
spec:
  containers:
  - image: fedora:latest
    name: volume-container-datacenter-1
    command: ["sleep", "3600"]
    volumeMounts:
      - name: volume-share
        mountPath: /tmp/beta
  - image: fedora:latest
    name: volume-container-datacenter-2
    command: ["sleep", "3600"]
    volumeMounts:
      - name: volume-share
        mountPath: /tmp/demo
  volumes: 
  - name: volume-share
    emptyDir: {}


# Kubernetes2_Task2_Sidecar_Container
apiVersion: v1
kind: Pod
metadata:
  name: webserver
spec:
  volumes:
  - name: shared-logs
    emptyDir: {}
  initContainers:
  - name: sidecar-container        # declared as initContainer
    image: ubuntu:latest
    restartPolicy: Always           # ← this makes it a native sidecar (K8s 1.29+)
    command:
    - "sh"
    - "-c"
    - "while true; do cat /var/log/nginx/access.log /var/log/nginx/error.log; sleep 30; done"
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/nginx
  containers:
  - name: nginx-container
    image: nginx:latest
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/nginx

